# Prod overrides — HA, spread across zones, more headroom.
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  NODE_ENV: production
  LOG_LEVEL: info

ingress:
  host: fleet.example.com

# Spread replicas across nodes/zones for resilience.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-ping
