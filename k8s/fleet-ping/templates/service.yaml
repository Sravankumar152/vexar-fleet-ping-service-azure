apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-ping.fullname" . }}
  labels:
    {{- include "fleet-ping.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fleet-ping.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
