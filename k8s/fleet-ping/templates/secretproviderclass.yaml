# Maps Azure Key Vault secrets into the cluster via the Secret Store CSI driver
# using Workload Identity. The driver also syncs them into a Kubernetes Secret
# so they can be consumed as environment variables.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "fleet-ping.fullname" . }}-kv
  labels:
    {{- include "fleet-ping.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .kvName }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ include "fleet-ping.fullname" . }}-secrets
      type: Opaque
      data:
        {{- range .Values.keyVault.secrets }}
        - objectName: {{ .kvName }}
          key: {{ .envName }}
        {{- end }}
